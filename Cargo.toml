[package]
name = "pixel1-translator"
version = "0.1.0"
edition = "2021"
authors = ["JereyBeni"]
description = "High-Level Emulation (HLE) compatibility layer for Google Pixel 1 (sailfish) Android 7.1 apps"
license = "MIT"

[lib]
name = "pixel1_translator"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "pixel1-translator"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["loader", "desktop"]
loader = []
desktop = []

[dependencies]
object = { version = "0.36", features = ["read", "elf", "write"] }
memmap2 = "0.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
winit = { version = "0.30", default-features = true }
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
glow = "0.14"
egui = "0.29"
egui_glow = { version = "0.29", features = ["winit"] }
egui-winit = "0.29"
rfd = { version = "0.15", optional = true }
cpal = { version = "0.15", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
once_cell = "1.19"
parking_lot = "0.12"
bitflags = "2.6"
bytemuck = { version = "1.16", features = ["derive"] }
lazy_static = "1.5"
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
cpal = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
ndk-context = "0.1"
ndk = "0.9"
jni = "0.21"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
