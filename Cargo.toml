[package]
name = "pixel1-translator"
version = "0.1.0"
edition = "2021"
authors = ["JereyBeni"]
description = "High-Level Emulation (HLE) compatibility layer for Google Pixel 1 (sailfish) Android 7.1 apps"
license = "MIT"

[features]
default = ["loader"]
loader = []

[dependencies]
# ELF parsing & memory mapping
object = { version = "0.36", features = ["read", "elf", "write"] }
memmap2 = "0.9"

# APK extraction
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Error handling & logging
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# Window / GL + UI
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
glow = "0.14"
egui = "0.29"
egui_glow = "0.29"
egui-winit = "0.29"

# Native file dialog ("Import ya!")
rfd = "0.15"

# Audio
cpal = "0.15"

# Serialization / config
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Misc
once_cell = "1.19"
parking_lot = "0.12"
bitflags = "2.6"
bytemuck = { version = "1.16", features = ["derive"] }
lazy_static = "1.5"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
