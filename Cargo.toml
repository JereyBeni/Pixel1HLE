[package]
name = "pixel1-translator"
version = "0.1.0"
edition = "2021"
authors = ["JereyBeni"]
description = "High-Level Emulation (HLE) compatibility layer for Google Pixel 1 (sailfish) Android 7.1 apps"
license = "MIT"

[dependencies]
# ELF parsing & memory mapping
object = { version = "0.36", features = ["read", "elf"] }
memmap2 = "0.9"

# Error handling & logging
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# Window / GL (display + touch)
winit = "0.30"
glutin = "0.32"
raw-window-handle = "0.6"

# Audio (software pipeline)
cpal = "0.15"

# Serialization / config
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Misc
once_cell = "1.19"
parking_lot = "0.12"
bitflags = "2.6"
bytemuck = { version = "1.16", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
