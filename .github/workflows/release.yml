name: Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows executable
  # ─────────────────────────────────────────────────────────────
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --features loader
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Package
        shell: pwsh
        run: |
          $Out = "dist/pixel1-translator-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$Out/config","$Out/apps","$Out/fonts","$Out/assets","$Out/logs" | Out-Null
          Copy-Item "target/release/pixel1-translator.exe" "$Out/"
          Copy-Item "config/pixel1-sailfish.yaml" "$Out/config/"
          Set-Content "$Out/apps/README.txt" "Drop APKs here or use Import ya!"
          $Version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$(Get-Date -Format yyyyMMdd-HHmm)" }
          Set-Content "$Out/VERSION.txt" $Version
          Compress-Archive -Path "$Out/*" -DestinationPath "dist/pixel1-translator-windows-x86_64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/pixel1-translator-windows-x86_64.zip
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Real Android APK (Gradle)
  # ─────────────────────────────────────────────────────────────
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Copy sailfish profile into APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp config/pixel1-sailfish.yaml android/app/src/main/assets/

      - name: Setup Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5 || true
          if [ ! -f gradlew ]; then
            # bootstrap wrapper if gradle not installed globally
            curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "Found APK: $APK"
          cp "$APK" dist/pixel1-hle.apk
          ls -lh dist/pixel1-hle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/pixel1-hle.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Publish release (tags / manual only)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [windows, android-apk]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Tag name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=dev-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Pixel1HLE ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/pixel1-translator-windows-x86_64.zip
            artifacts/pixel1-hle.apk
          body: |
            ## Pixel1HLE ${{ steps.tag.outputs.name }}

            ### Windows
            - `pixel1-translator-windows-x86_64.zip` → run `pixel1-translator.exe`

            ### Android APK
            - Install `pixel1-hle.apk` (debug build)
            - Package: `com.pixel.hle`
            - Use **Import ya!** to pick guest APKs
            - Data: `Android/data/com.pixel.hle/` (app external files dir)
