name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features "loader,desktop"
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
      - name: Package
        shell: pwsh
        run: |
          $Out = "dist/pixel1-translator-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$Out/config","$Out/apps","$Out/logs" | Out-Null
          Copy-Item "target/release/pixel1-translator.exe" "$Out/"
          Copy-Item "config/pixel1-sailfish.yaml" "$Out/config/"
          Compress-Archive -Path "$Out/*" -DestinationPath "dist/pixel1-translator-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/pixel1-translator-windows-x86_64.zip
          retention-days: 7

  android-apk:
    name: Android APK (Rust NativeActivity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646161dcb09b76f32bff1f726404cc" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "platform-tools" || true
          fi

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust cdylib for arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          # Find NDK if version path differs
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            ANDROID_NDK_HOME=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d | tail -n1)
            export ANDROID_NDK_HOME
          fi
          echo "NDK=$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs \
            build --release --no-default-features --features loader
          ls -la android/app/src/main/jniLibs/arm64-v8a/ || true
          # cargo-ndk names it libpixel1_translator.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Assemble APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n1)
          cp "$APK" dist/pixel1-hle.apk
          ls -lh dist/pixel1-hle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/pixel1-hle.apk
          retention-days: 14

  release:
    name: Publish Release
    needs: [windows, android-apk]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'dev' }}
          draft: true
          files: |
            artifacts/windows-x86_64/pixel1-translator-windows-x86_64.zip
            artifacts/android-apk/pixel1-hle.apk
