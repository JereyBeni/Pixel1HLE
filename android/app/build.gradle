plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixel.hle'
    compileSdk 34

    defaultConfig {
        applicationId "com.pixel.hle"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0-rust"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            // Rust .so dropped here by CI / cargo-ndk
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

// No Java/Kotlin dependencies – pure native
dependencies {
}
